# Local development database. Not intended for production use.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cost_tracker
      POSTGRES_PASSWORD: cost_tracker
      POSTGRES_DB: cost_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cost_tracker -d cost_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
