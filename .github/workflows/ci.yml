name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder so env validation passes during build; no database is contacted.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Production build requires sign-in for the dashboard and a key for ingestion
        run: |
          npm start -- -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          for path in /overview /spend /usage /projects /projects/new /projects/x/edit; do
            RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:3000$path")
            echo "$path -> $RESULT"
            case "$RESULT" in "307 http://localhost:3000/login?next="*) ;; *) exit 1 ;; esac
          done
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)
          echo "/login -> $STATUS"; test "$STATUS" = 200
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/usage)
          echo "/api/usage without a key -> $STATUS"; test "$STATUS" = 401

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a secret removed in a later commit is still found.
          fetch-depth: 0
      - name: Scan the full Git history for secrets
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --log-opts="--all" --redact --no-banner --verbose .

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches docker-compose.yml so CI exercises the documented dev setup.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cost_tracker
          POSTGRES_PASSWORD: cost_tracker
          POSTGRES_DB: cost_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cost_tracker -d cost_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cost_tracker:cost_tracker@localhost:5432/cost_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes without a migration. Run npm run db:generate and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Apply migrations to an empty database
        run: npm run db:migrate
      - name: Re-apply migrations (should be a no-op)
        run: npm run db:migrate
      - name: Seed the database
        run: npm run db:seed
      - name: Re-seed (should insert nothing)
        run: npm run db:seed | tee seed.log && grep -q "Seeded 0 project(s) and 0 of" seed.log
      - run: npm run test:integration
      - name: Smoke-test POST /api/usage against the seeded database
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done

          # Create a throwaway key for this run's database; mask it in the logs.
          npm run --silent api-key -- create --project sample-app --name ci-smoke > api-key.txt
          API_KEY=$(grep -oE 'act_[A-Za-z0-9_-]{43}' api-key.txt)
          echo "::add-mask::$API_KEY"
          KEY_PREFIX=$(echo "$API_KEY" | cut -c1-12)

          BODY="{\"provider\":\"openai\",\"model\":\"gpt-4.1\",\"inputTokens\":1000,\"outputTokens\":500,\"requestId\":\"ci-smoke-$GITHUB_RUN_ID\"}"
          post() { curl -s -o response.json -w '%{http_code}' -X POST http://localhost:3000/api/usage -H 'content-type: application/json' "$@" -d "$BODY"; }

          # No key, and a well-formed key that doesn't exist, are both rejected
          STATUS=$(post); cat response.json; echo
          test "$STATUS" = 401
          STATUS=$(post -H "authorization: Bearer act_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | cut -c1-43)"); echo
          test "$STATUS" = 401

          # gpt-4.1 seed price: $2 input, $8 output per 1M tokens
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.006000"' response.json
          EVENT_ID=$(grep -oE '"id":"[^"]+"' response.json | head -1)

          # A retry returns the same event instead of storing another
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 200
          grep -q "$EVENT_ID" response.json
          grep -q '"replayed":true' response.json
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id = 'ci-smoke-$GITHUB_RUN_ID'")" = 1

          # Reusing the request id for different usage is a conflict
          BODY=$(echo "$BODY" | sed 's/"outputTokens":500/"outputTokens":501/')
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 409

          # A revoked key stops working
          npm run --silent api-key -- revoke "$KEY_PREFIX"
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 401

          # Repeated invalid keys from one address get 429 with Retry-After
          # (30 per 15 minutes; two were rejected above). Valid keys still
          # work from the same address, as the long-prompt check below shows.
          for i in $(seq 1 30); do
            STATUS=$(post -D headers.txt -H "authorization: Bearer act_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | cut -c1-43)")
            test "$STATUS" = 429 && break
            test "$STATUS" = 401
          done
          cat response.json; echo; grep -i '^retry-after:' headers.txt
          test "$STATUS" = 429
          grep -q '"code":"rate_limited"' response.json

          # Dashboard: a throwaway account with a random, masked password
          export SMOKE_EMAIL=smoke@example.com
          export SMOKE_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$SMOKE_PASSWORD"
          if echo "too-short" | npm run --silent user -- create --email short@example.com; then
            echo "a short password was accepted"; exit 1
          fi
          echo "$SMOKE_PASSWORD" | npm run --silent user -- create --email "$SMOKE_EMAIL"

          # Sign-in, spend overview, project create/duplicate/edit, 404s and
          # sign-out. The only usage recorded today is the $0.006 event above.
          EXPECT_TODAY_SPEND='$0.006' EXPECT_REQUEST_ID="ci-smoke-$GITHUB_RUN_ID" node scripts/smoke-projects.mjs http://localhost:3000

          # Account management: list shows emails, never hashes; a reset
          # takes a new password and signs the user out; unknown emails fail.
          npm run --silent user -- list | tee users.txt
          grep -q "^$SMOKE_EMAIL " users.txt
          if grep -q 'scrypt' users.txt; then echo "list shows a hash"; exit 1; fi
          if echo "too-short" | npm run --silent user -- reset-password --email "$SMOKE_EMAIL"; then
            echo "a short password was accepted"; exit 1
          fi
          NEW_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$NEW_PASSWORD"
          echo "$NEW_PASSWORD" | npm run --silent user -- reset-password --email "$SMOKE_EMAIL" | tee reset.txt
          grep -q "Reset the password for $SMOKE_EMAIL" reset.txt
          npm run --silent user -- revoke-sessions --email "$SMOKE_EMAIL"
          if npm run --silent user -- revoke-sessions --email nobody@example.com; then
            echo "an unknown email was accepted"; exit 1
          fi

          # Long-prompt tier and cache writes through the real API, with a
          # fresh key (the first one was revoked above). Claude Haiku 5.5
          # charges more for prompts over 100,000 input tokens:
          # 100,000 * $0.50 + 50,000 writes * $0.625 + 1,000 out * $2.50, per 1M
          npm run --silent api-key -- create --project sample-app --name ci-tiers > api-key-2.txt
          API_KEY_2=$(grep -oE 'act_[A-Za-z0-9_-]{43}' api-key-2.txt)
          echo "::add-mask::$API_KEY_2"
          BODY='{"provider":"anthropic","model":"claude-haiku-5-5","inputTokens":150000,"cacheWriteInputTokens":50000,"outputTokens":1000}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.083750"' response.json
          grep -q '"cacheWriteInputTokens":50000' response.json
      - name: Demo data loads, refuses production, and removes cleanly
        run: |
          npm run db:demo | tee demo.log
          grep -q "demo-support-bot: budget warning" demo.log
          grep -q "demo-research-agent: budget over" demo.log
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects WHERE slug LIKE 'demo-%'")" = 4
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) > 8000 FROM usage_events WHERE request_id LIKE 'demo-%'")" = t

          if NODE_ENV=production npm run --silent db:demo; then
            echo "demo data ran in production without --allow-production"; exit 1
          fi

          npm run db:demo -- --remove
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id LIKE 'demo-%'")" = 0
      - name: Show dev server log
        if: failure()
        run: cat next-dev.log || true

  docker:
    runs-on: ubuntu-latest
    env:
      # Only for this throwaway CI stack.
      POSTGRES_PASSWORD: ci-docker-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Postgres, migrations and the app
        run: docker compose up -d --build --wait --wait-timeout 180 app
      - name: The app serves pages and enforces authentication
        run: |
          check() {
            RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$@")
            echo "$* -> $RESULT" >&2
            echo "$RESULT"
          }
          test "$(check http://localhost:3000/login | tail -1)" = "200 "
          case "$(check http://localhost:3000/projects | tail -1)" in "307 http://localhost:3000/login"*) ;; *) exit 1 ;; esac
          test "$(check -X POST http://localhost:3000/api/usage | tail -1)" = "401 "
      - name: The app runs as a non-root user
        run: |
          USER_ID=$(docker compose exec -T app id -u)
          echo "app runs as uid $USER_ID"
          test "$USER_ID" != "0"
      - name: Migrations applied and the CLI works in the tools image
        run: |
          docker compose ps -a migrate --format '{{.State}} {{.ExitCode}}' | grep -q "exited 0"
          PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$PASSWORD"
          echo "$PASSWORD" | docker compose run --rm -T migrate npm run --silent user -- create --email docker@example.com
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
