name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder so env validation passes during build; no database is contacted.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Production build requires sign-in for the dashboard and a key for ingestion
        run: |
          npm start -- -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          for path in /overview /spend /usage /breakdown /projects /projects/new /projects/x/edit; do
            RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:3000$path")
            echo "$path -> $RESULT"
            case "$RESULT" in "307 http://localhost:3000/login?next="*) ;; *) exit 1 ;; esac
          done
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)
          echo "/login -> $STATUS"; test "$STATUS" = 200
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/usage)
          echo "/api/usage without a key -> $STATUS"; test "$STATUS" = 401

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a secret removed in a later commit is still found.
          fetch-depth: 0
      - name: Scan the full Git history for secrets
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --log-opts="--all" --redact --no-banner --verbose .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The oldest Python the client supports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python client tests
        run: python -m unittest discover -s clients/python -v

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches docker-compose.yml so CI exercises the documented dev setup.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cost_tracker
          POSTGRES_PASSWORD: cost_tracker
          POSTGRES_DB: cost_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cost_tracker -d cost_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cost_tracker:cost_tracker@localhost:5432/cost_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes without a migration. Run npm run db:generate and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Apply migrations to an empty database
        run: npm run db:migrate
      - name: Re-apply migrations (should be a no-op)
        run: npm run db:migrate
      - name: Seed the database
        run: npm run db:seed
      - name: Re-seed (should insert nothing)
        run: npm run db:seed | tee seed.log && grep -q "Seeded 0 project(s) and 0 of" seed.log
      - run: npm run test:integration
      - name: Smoke-test POST /api/usage against the seeded database
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done

          # Create a throwaway key for this run's database; mask it in the logs.
          npm run --silent api-key -- create --project sample-app --name ci-smoke > api-key.txt
          API_KEY=$(grep -oE 'act_[A-Za-z0-9_-]{43}' api-key.txt)
          echo "::add-mask::$API_KEY"
          KEY_PREFIX=$(echo "$API_KEY" | cut -c1-12)

          BODY="{\"provider\":\"openai\",\"model\":\"gpt-4.1\",\"inputTokens\":1000,\"outputTokens\":500,\"requestId\":\"ci-smoke-$GITHUB_RUN_ID\"}"
          post() { curl -s -o response.json -w '%{http_code}' -X POST http://localhost:3000/api/usage -H 'content-type: application/json' "$@" -d "$BODY"; }

          # No key, and a well-formed key that doesn't exist, are both rejected
          STATUS=$(post); cat response.json; echo
          test "$STATUS" = 401
          STATUS=$(post -H "authorization: Bearer act_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | cut -c1-43)"); echo
          test "$STATUS" = 401

          # gpt-4.1 seed price: $2 input, $8 output per 1M tokens
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.006000"' response.json
          EVENT_ID=$(grep -oE '"id":"[^"]+"' response.json | head -1)

          # A retry returns the same event instead of storing another
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 200
          grep -q "$EVENT_ID" response.json
          grep -q '"replayed":true' response.json
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id = 'ci-smoke-$GITHUB_RUN_ID'")" = 1

          # Reusing the request id for different usage is a conflict
          BODY=$(echo "$BODY" | sed 's/"outputTokens":500/"outputTokens":501/')
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 409

          # A revoked key stops working
          npm run --silent api-key -- revoke "$KEY_PREFIX"
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 401

          # Repeated invalid keys from one address get 429 with Retry-After
          # (30 per 15 minutes; two were rejected above). Valid keys still
          # work from the same address, as the long-prompt check below shows.
          for i in $(seq 1 30); do
            STATUS=$(post -D headers.txt -H "authorization: Bearer act_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | cut -c1-43)")
            test "$STATUS" = 429 && break
            test "$STATUS" = 401
          done
          cat response.json; echo; grep -i '^retry-after:' headers.txt
          test "$STATUS" = 429
          grep -q '"code":"rate_limited"' response.json

          # Dashboard: a throwaway account with a random, masked password
          export SMOKE_EMAIL=smoke@example.com
          export SMOKE_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$SMOKE_PASSWORD"
          if echo "too-short" | npm run --silent user -- create --email short@example.com; then
            echo "a short password was accepted"; exit 1
          fi
          echo "$SMOKE_PASSWORD" | npm run --silent user -- create --email "$SMOKE_EMAIL"

          # Sign-in, spend overview, project create/duplicate/edit, 404s and
          # sign-out. The only usage recorded today is the $0.006 event above.
          EXPECT_TODAY_SPEND='$0.006' EXPECT_REQUEST_ID="ci-smoke-$GITHUB_RUN_ID" node scripts/smoke-projects.mjs http://localhost:3000

          # Account management: list shows emails, never hashes; a reset
          # takes a new password and signs the user out; unknown emails fail.
          npm run --silent user -- list | tee users.txt
          grep -q "^$SMOKE_EMAIL " users.txt
          if grep -q 'scrypt' users.txt; then echo "list shows a hash"; exit 1; fi
          if echo "too-short" | npm run --silent user -- reset-password --email "$SMOKE_EMAIL"; then
            echo "a short password was accepted"; exit 1
          fi
          NEW_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$NEW_PASSWORD"
          echo "$NEW_PASSWORD" | npm run --silent user -- reset-password --email "$SMOKE_EMAIL" | tee reset.txt
          grep -q "Reset the password for $SMOKE_EMAIL" reset.txt
          npm run --silent user -- revoke-sessions --email "$SMOKE_EMAIL"
          if npm run --silent user -- revoke-sessions --email nobody@example.com; then
            echo "an unknown email was accepted"; exit 1
          fi

          # Long-prompt tier and cache writes through the real API, with a
          # fresh key (the first one was revoked above). Claude Haiku 5.5
          # charges more for prompts over 100,000 input tokens:
          # 100,000 * $0.50 + 50,000 writes * $0.625 + 1,000 out * $2.50, per 1M
          npm run --silent api-key -- create --project sample-app --name ci-tiers > api-key-2.txt
          API_KEY_2=$(grep -oE 'act_[A-Za-z0-9_-]{43}' api-key-2.txt)
          echo "::add-mask::$API_KEY_2"
          BODY='{"provider":"anthropic","model":"claude-haiku-5-5","inputTokens":150000,"cacheWriteInputTokens":50000,"outputTokens":1000}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.083750"' response.json
          grep -q '"cacheWriteInputTokens":50000' response.json

          # Attribution is stored in its own columns and returned
          BODY='{"provider":"google","model":"gemini-3.5-flash-lite","inputTokens":100,"outputTokens":10,"customerId":" cus_ci ","userId":"u_ci","feature":"ci-smoke","runId":"run_ci"}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"customerId":"cus_ci"' response.json
          test "$(psql "$DATABASE_URL" -tAc "SELECT concat_ws('|', customer_id, user_id, feature, run_id) FROM usage_events WHERE run_id = 'run_ci'")" = "cus_ci|u_ci|ci-smoke|run_ci"
          BODY='{"provider":"google","model":"gemini-3.5-flash-lite","inputTokens":1,"outputTokens":1,"feature":""}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); test "$STATUS" = 400

          # The TypeScript client: an Anthropic response with cache traffic,
          # reported through track(), priced and replayed safely.
          COST_TRACKER_API_KEY="$API_KEY_2" node scripts/smoke-client.mjs http://localhost:3000
          COST_TRACKER_API_KEY="$API_KEY_2" python3 scripts/smoke_client.py http://localhost:3000

          # OpenTelemetry: an OTLP/HTTP JSON export with an Anthropic chat span
          # (cache traffic included in input_tokens, as the GenAI conventions
          # specify), an HTTP span to ignore and a span with an unpriced model.
          otel() { curl -s -o otel.json -w '%{http_code}' -X POST http://localhost:3000/api/otel/v1/traces -H "authorization: Bearer $API_KEY_2" -H 'content-type: application/json' --data @otlp.json; }
          SPAN_ID=$(openssl rand -hex 8)
          NOW_NS=$(date +%s%N)
          cat > otlp.json <<JSON
          {"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"ci-smoke"}},{"key":"cost_tracker.feature","value":{"stringValue":"ci-otel"}}]},"scopeSpans":[{"spans":[
            {"traceId":"$GITHUB_RUN_ID","spanId":"$SPAN_ID","name":"chat claude-sonnet-5-5","endTimeUnixNano":"$NOW_NS","attributes":[
              {"key":"gen_ai.operation.name","value":{"stringValue":"chat"}},
              {"key":"gen_ai.provider.name","value":{"stringValue":"anthropic"}},
              {"key":"gen_ai.request.model","value":{"stringValue":"claude-sonnet-5-5"}},
              {"key":"cost_tracker.customer_id","value":{"stringValue":"cus_otel"}},
              {"key":"user.id","value":{"stringValue":"u_otel"}},
              {"key":"gen_ai.usage.input_tokens","value":{"intValue":"10050"}},
              {"key":"gen_ai.usage.cache_read.input_tokens","value":{"intValue":"8000"}},
              {"key":"gen_ai.usage.cache_creation.input_tokens","value":{"intValue":"2000"}},
              {"key":"gen_ai.usage.output_tokens","value":{"intValue":"400"}}]},
            {"traceId":"$GITHUB_RUN_ID","spanId":"http-span","name":"POST","attributes":[{"key":"http.request.method","value":{"stringValue":"POST"}}]},
            {"traceId":"$GITHUB_RUN_ID","spanId":"unpriced","name":"chat","endTimeUnixNano":"$NOW_NS","attributes":[
              {"key":"gen_ai.provider.name","value":{"stringValue":"openai"}},
              {"key":"gen_ai.request.model","value":{"stringValue":"not-a-real-model"}},
              {"key":"gen_ai.usage.input_tokens","value":{"intValue":"10"}},
              {"key":"gen_ai.usage.output_tokens","value":{"intValue":"5"}}]}
          ]}]}]}
          JSON
          STATUS=$(otel); cat otel.json; echo
          test "$STATUS" = 200
          grep -q '"rejectedSpans":1' otel.json
          grep -q 'no price for openai/not-a-real-model' otel.json
          # Same Sonnet 5.5 cost as the client checks: $0.009900
          OTEL_ID="otel:$GITHUB_RUN_ID:$SPAN_ID"
          # Attribution: span attributes, plus the feature set once on the resource
          test "$(psql "$DATABASE_URL" -tAc "SELECT concat_ws('|', customer_id, user_id, feature) FROM usage_events WHERE request_id = '$OTEL_ID'")" = "cus_otel|u_otel|ci-otel"
          # ...and from both clients, through their scoped trackers
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE customer_id = 'cus_ts' AND feature = 'ci-ts' AND run_id LIKE 'run_ts_msg_smoke_%'")" = 1
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE customer_id = 'cus_py' AND feature = 'ci-py' AND run_id LIKE 'run_py_msg_py_smoke_%'")" = 1
          test "$(psql "$DATABASE_URL" -tAc "SELECT cost_usd FROM usage_events WHERE request_id = '$OTEL_ID'")" = 0.009900
          # A collector retrying the export, gzipped as the Collector sends
          # it by default, doesn't store the span twice
          STATUS=$(gzip -c otlp.json | curl -s -o otel.json -w '%{http_code}' -X POST http://localhost:3000/api/otel/v1/traces -H "authorization: Bearer $API_KEY_2" -H 'content-type: application/json' -H 'content-encoding: gzip' --data-binary @-)
          cat otel.json; echo; test "$STATUS" = 200
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id = '$OTEL_ID'")" = 1
          # Protobuf isn't supported; the error says how to configure JSON
          STATUS=$(curl -s -o otel.json -w '%{http_code}' -X POST http://localhost:3000/api/otel/v1/traces -H "authorization: Bearer $API_KEY_2" -H 'content-type: application/x-protobuf' --data-binary 'x')
          cat otel.json; echo; test "$STATUS" = 415

          # Reconciliation against a saved Anthropic cost report (cents as
          # decimal strings, grouped by description), never the live API.
          # Recorded today: Haiku $0.083750 (tier check above) and three
          # Sonnet events at $0.009900 (TS, Python, OTel) = $0.029700.
          TODAY=$(date -u +%F)
          cat > cost-report.json <<JSON
          {"data":[{"starting_at":"${TODAY}T00:00:00Z","ending_at":"x","results":[
            {"amount":"8.375","currency":"USD","cost_type":"tokens","model":"claude-haiku-5-5"},
            {"amount":"2","currency":"USD","cost_type":"tokens","model":"claude-sonnet-5-5"},
            {"amount":"1","currency":"USD","cost_type":"tokens","model":"claude-sonnet-5-5"},
            {"amount":"250","currency":"USD","cost_type":"tokens","model":"claude-opus-5-5"},
            {"amount":"10","currency":"USD","cost_type":"web_search","model":null}
          ]}],"has_more":false,"next_page":null}
          JSON
          npm run --silent reconcile -- --provider anthropic --from "$TODAY" --report-file cost-report.json | tee reconcile.log
          # Haiku matches exactly; Sonnet is $0.0003 under (below a cent, not
          # flagged); Opus was billed but never recorded (flagged).
          grep -E 'claude-haiku-5-5.*\$0\.083750.*\$0\.083750.*\$0\.000000' reconcile.log
          grep -E 'claude-sonnet-5-5.*\$0\.030000.*\$0\.029700.*-\$0\.000300' reconcile.log | grep -v CHECK
          grep -E 'claude-opus-5-5.*\$2\.500000.*\$0\.000000.*-\$2\.500000.*CHECK' reconcile.log
          grep -qF 'Billed but not tracked (web_search): $0.100000' reconcile.log
          # Without a report file it needs an Admin API key, and says so
          if npm run --silent reconcile -- --provider anthropic --from "$TODAY" 2> reconcile-err.log; then exit 1; fi
          grep -q ANTHROPIC_ADMIN_KEY reconcile-err.log

          # OpenAI, compared per day across all models, from a saved costs
          # page (dollars as numbers, Unix-second buckets). The only OpenAI
          # usage recorded today is the $0.006 gpt-4.1 smoke event above.
          START=$(date -u -d "$TODAY" +%s)
          openai_costs() {
            echo "{\"object\":\"page\",\"data\":[{\"object\":\"bucket\",\"start_time\":$START,\"end_time\":$((START + 86400)),\"results\":[$1]}],\"has_more\":false,\"next_page\":null}" > openai-costs.json
          }
          ITEM() { echo "{\"object\":\"organization.costs.result\",\"amount\":{\"value\":$1,\"currency\":\"usd\"},\"line_item\":\"$2\",\"project_id\":null}"; }
          openai_costs "$(ITEM 0.002 'gpt-4.1, input'),$(ITEM 0.004 'gpt-4.1, output')"
          npm run --silent reconcile -- --provider openai --from "$TODAY" --report-file openai-costs.json | tee openai-reconcile.log
          grep -E 'all models.*\$0\.006000.*\$0\.006000.*\$0\.000000' openai-reconcile.log | grep -v CHECK
          grep -qF 'gpt-4.1, output' openai-reconcile.log
          # An untracked charge (images) makes the day differ, and it's flagged
          openai_costs "$(ITEM 0.002 'gpt-4.1, input'),$(ITEM 0.004 'gpt-4.1, output'),$(ITEM 0.04 'Image models')"
          npm run --silent reconcile -- --provider openai --from "$TODAY" --report-file openai-costs.json | tee openai-reconcile.log
          grep -E 'all models.*\$0\.046000.*\$0\.006000.*-\$0\.040000.*CHECK' openai-reconcile.log
          if npm run --silent reconcile -- --provider openai --from "$TODAY" 2> reconcile-err.log; then exit 1; fi
          grep -q OPENAI_ADMIN_KEY reconcile-err.log
      - name: Demo data loads, refuses production, and removes cleanly
        run: |
          npm run db:demo | tee demo.log
          grep -q "demo-support-bot: budget warning" demo.log
          grep -q "demo-research-agent: budget over" demo.log
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects WHERE slug LIKE 'demo-%'")" = 4
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) > 8000 FROM usage_events WHERE request_id LIKE 'demo-%'")" = t

          if NODE_ENV=production npm run --silent db:demo; then
            echo "demo data ran in production without --allow-production"; exit 1
          fi

          npm run db:demo -- --remove
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id LIKE 'demo-%'")" = 0
      - name: Screenshot the dashboard with demo data, in light and dark mode
        run: |
          # Demo projects only, as a new user would see them. This is the
          # job's last use of its throwaway database.
          psql "$DATABASE_URL" -c "DELETE FROM projects WHERE slug NOT LIKE 'demo-%'"
          npm run --silent db:demo
          SHOT_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$SHOT_PASSWORD"
          echo "$SHOT_PASSWORD" | npm run --silent user -- create --email demo@example.com
          SHOT_EMAIL=demo@example.com SHOT_PASSWORD="$SHOT_PASSWORD" node scripts/screenshots.mjs http://localhost:3000 screenshots
      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
      - name: Show dev server log
        if: failure()
        run: cat next-dev.log || true

  docker:
    runs-on: ubuntu-latest
    env:
      # Only for this throwaway CI stack.
      POSTGRES_PASSWORD: ci-docker-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Postgres, migrations and the app
        run: docker compose up -d --build --wait --wait-timeout 180 app
      - name: The app serves pages and enforces authentication
        run: |
          check() {
            RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$@")
            echo "$* -> $RESULT" >&2
            echo "$RESULT"
          }
          test "$(check http://localhost:3000/login | tail -1)" = "200 "
          case "$(check http://localhost:3000/projects | tail -1)" in "307 http://localhost:3000/login"*) ;; *) exit 1 ;; esac
          test "$(check -X POST http://localhost:3000/api/usage | tail -1)" = "401 "
      - name: The app runs as a non-root user
        run: |
          USER_ID=$(docker compose exec -T app id -u)
          echo "app runs as uid $USER_ID"
          test "$USER_ID" != "0"
      - name: Migrations applied and the CLI works in the tools image
        run: |
          docker compose ps -a migrate --format '{{.State}} {{.ExitCode}}' | grep -q "exited 0"
          PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$PASSWORD"
          echo "$PASSWORD" | docker compose run --rm -T migrate npm run --silent user -- create --email docker@example.com
      - name: The README quick start loads prices and demo data
        run: |
          docker compose run --rm migrate npm run --silent db:seed
          docker compose run --rm migrate npm run --silent db:demo | tee demo.log
          grep -q "demo-research-agent: budget over" demo.log
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
