name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder so env validation passes during build; no database is contacted.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Production build requires sign-in for the dashboard and a key for ingestion
        run: |
          npm start -- -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          for path in /overview /spend /usage /usage/export /breakdown /prices /prices/new /prices/x/end /projects /projects/new /projects/x/edit; do
            RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:3000$path")
            echo "$path -> $RESULT"
            case "$RESULT" in "307 http://localhost:3000/login?next="*) ;; *) exit 1 ;; esac
          done
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)
          echo "/login -> $STATUS"; test "$STATUS" = 200
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/usage)
          echo "/api/usage without a key -> $STATUS"; test "$STATUS" = 401

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a secret removed in a later commit is still found.
          fetch-depth: 0
      - name: Scan the full Git history for secrets
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --log-opts="--all" --redact --no-banner --verbose .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The oldest Python the client supports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python client tests
        run: python -m unittest discover -s clients/python -v

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches docker-compose.yml so CI exercises the documented dev setup.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cost_tracker
          POSTGRES_PASSWORD: cost_tracker
          POSTGRES_DB: cost_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cost_tracker -d cost_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cost_tracker:cost_tracker@localhost:5432/cost_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes without a migration. Run npm run db:generate and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Apply migrations to an empty database
        run: npm run db:migrate
      - name: Re-apply migrations (should be a no-op)
        run: npm run db:migrate
      - name: Seed the database
        run: npm run db:seed
      - name: Re-seed (should insert nothing)
        run: npm run db:seed | tee seed.log && grep -q "Seeded 0 project(s) and 0 of" seed.log
      - run: npm run test:integration
      - name: Smoke-test POST /api/usage against the seeded database
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done

          # Create a throwaway key for this run's database; mask it in the logs.
          npm run --silent api-key -- create --project sample-app --name ci-smoke > api-key.txt
          API_KEY=$(grep -oE 'act_[A-Za-z0-9_-]{43}' api-key.txt)
          echo "::add-mask::$API_KEY"
          KEY_PREFIX=$(echo "$API_KEY" | cut -c1-12)

          BODY="{\"provider\":\"openai\",\"model\":\"gpt-4.1\",\"inputTokens\":1000,\"outputTokens\":500,\"requestId\":\"ci-smoke-$GITHUB_RUN_ID\"}"
          post() { curl -s -o response.json -w '%{http_code}' -X POST http://localhost:3000/api/usage -H 'content-type: application/json' "$@" -d "$BODY"; }

          # No key, and a well-formed key that doesn't exist, are both rejected
          STATUS=$(post); cat response.json; echo
          test "$STATUS" = 401
          STATUS=$(post -H "authorization: Bearer act_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | cut -c1-43)"); echo
          test "$STATUS" = 401

          # gpt-4.1 seed price: $2 input, $8 output per 1M tokens
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.006000"' response.json
          EVENT_ID=$(grep -oE '"id":"[^"]+"' response.json | head -1)

          # A retry returns the same event instead of storing another
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 200
          grep -q "$EVENT_ID" response.json
          grep -q '"replayed":true' response.json
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id = 'ci-smoke-$GITHUB_RUN_ID'")" = 1

          # Reusing the request id for different usage is a conflict
          BODY=$(echo "$BODY" | sed 's/"outputTokens":500/"outputTokens":501/')
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 409

          # A revoked key stops working
          npm run --silent api-key -- revoke "$KEY_PREFIX"
          STATUS=$(post -H "authorization: Bearer $API_KEY"); cat response.json; echo
          test "$STATUS" = 401

          # Repeated invalid keys from one address get 429 with Retry-After
          # (30 per 15 minutes; two were rejected above). Valid keys still
          # work from the same address, as the long-prompt check below shows.
          for i in $(seq 1 30); do
            STATUS=$(post -D headers.txt -H "authorization: Bearer act_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | cut -c1-43)")
            test "$STATUS" = 429 && break
            test "$STATUS" = 401
          done
          cat response.json; echo; grep -i '^retry-after:' headers.txt
          test "$STATUS" = 429
          grep -q '"code":"rate_limited"' response.json

          # Dashboard: a throwaway account with a random, masked password
          export SMOKE_EMAIL=smoke@example.com
          export SMOKE_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$SMOKE_PASSWORD"
          if echo "too-short" | npm run --silent user -- create --email short@example.com; then
            echo "a short password was accepted"; exit 1
          fi
          echo "$SMOKE_PASSWORD" | npm run --silent user -- create --email "$SMOKE_EMAIL"
          export SMOKE_VIEWER_EMAIL="viewer-$GITHUB_RUN_ID@example.com"
          echo "$SMOKE_PASSWORD" | npm run --silent user -- create --email "$SMOKE_VIEWER_EMAIL" --role viewer
          if echo "$SMOKE_PASSWORD" | npm run --silent user -- create --email bad-role@example.com --role owner; then
            echo "an unknown role was accepted"; exit 1
          fi

          # Sign-in, spend overview, project create/duplicate/edit, 404s and
          # sign-out. The only usage recorded today is the $0.006 event above.
          EXPECT_TODAY_SPEND='$0.006' EXPECT_REQUEST_ID="ci-smoke-$GITHUB_RUN_ID" node scripts/smoke-projects.mjs http://localhost:3000

          # Account management: list shows emails, never hashes; a reset
          # takes a new password and signs the user out; unknown emails fail.
          npm run --silent user -- list | tee users.txt
          grep -q "^$SMOKE_EMAIL  admin " users.txt
          grep -q "^$SMOKE_VIEWER_EMAIL  viewer " users.txt
          npm run --silent user -- set-role --email "$SMOKE_VIEWER_EMAIL" --role member | tee role.txt
          grep -q "is now member" role.txt
          if grep -q 'scrypt' users.txt; then echo "list shows a hash"; exit 1; fi
          if echo "too-short" | npm run --silent user -- reset-password --email "$SMOKE_EMAIL"; then
            echo "a short password was accepted"; exit 1
          fi
          NEW_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$NEW_PASSWORD"
          echo "$NEW_PASSWORD" | npm run --silent user -- reset-password --email "$SMOKE_EMAIL" | tee reset.txt
          grep -q "Reset the password for $SMOKE_EMAIL" reset.txt
          npm run --silent user -- revoke-sessions --email "$SMOKE_EMAIL"
          if npm run --silent user -- revoke-sessions --email nobody@example.com; then
            echo "an unknown email was accepted"; exit 1
          fi

          # Long-prompt tier and cache writes through the real API, with a
          # fresh key (the first one was revoked above). Claude Haiku 5.5
          # charges more for prompts over 100,000 input tokens:
          # 100,000 * $0.50 + 50,000 writes * $0.625 + 1,000 out * $2.50, per 1M
          npm run --silent api-key -- create --project sample-app --name ci-tiers > api-key-2.txt
          API_KEY_2=$(grep -oE 'act_[A-Za-z0-9_-]{43}' api-key-2.txt)
          echo "::add-mask::$API_KEY_2"
          BODY='{"provider":"anthropic","model":"claude-haiku-5-5","inputTokens":150000,"cacheWriteInputTokens":50000,"outputTokens":1000}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.083750"' response.json
          grep -q '"cacheWriteInputTokens":50000' response.json

          # 1-hour cache writes at their own rate. Dated yesterday, so the
          # reconciliation below (today's costs) isn't affected. Sonnet 5.5:
          # 4,000 * $2 + 2,000 5-minute writes * $2.50 + 4,000 1-hour writes * $4
          YESTERDAY="$(date -u -d yesterday +%F)T12:00:00Z"
          BODY="{\"provider\":\"anthropic\",\"model\":\"claude-sonnet-5-5\",\"inputTokens\":10000,\"cacheWriteInputTokens\":6000,\"cacheWrite1hInputTokens\":4000,\"outputTokens\":0,\"requestId\":\"ci-1h-$GITHUB_RUN_ID\",\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.029000"' response.json
          grep -q '"cacheWrite1hInputTokens":4000' response.json
          # A retry that splits the writes differently is a conflict
          BODY="{\"provider\":\"anthropic\",\"model\":\"claude-sonnet-5-5\",\"inputTokens\":10000,\"cacheWriteInputTokens\":6000,\"cacheWrite1hInputTokens\":3000,\"outputTokens\":0,\"requestId\":\"ci-1h-$GITHUB_RUN_ID\",\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); test "$STATUS" = 409
          # More 1-hour writes than writes is invalid
          BODY='{"provider":"anthropic","model":"claude-sonnet-5-5","inputTokens":10000,"cacheWriteInputTokens":10,"cacheWrite1hInputTokens":11,"outputTokens":0}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); test "$STATUS" = 400

          # Batch: the same usage through Anthropic's Batch API costs exactly
          # half ($0.029 -> $0.0145), also dated yesterday
          BODY="{\"provider\":\"anthropic\",\"model\":\"claude-sonnet-5-5\",\"inputTokens\":10000,\"cacheWriteInputTokens\":6000,\"cacheWrite1hInputTokens\":4000,\"outputTokens\":0,\"serviceTier\":\"batch\",\"requestId\":\"ci-batch-$GITHUB_RUN_ID\",\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.014500"' response.json
          grep -q '"serviceTier":"batch"' response.json
          # Flex and fast tiers have their own price rows. A model of the
          # "other" provider keeps reconciliation's totals unchanged, and an
          # early start date keeps the check independent of today's date.
          psql "$DATABASE_URL" -qc "INSERT INTO model_pricing (provider, model, service_tier, input_per_mtok_usd, output_per_mtok_usd, effective_from) VALUES ('other', 'ci-tiers', 'standard', 1, 2, '2026-01-01'), ('other', 'ci-tiers', 'fast', 3, 6, '2026-01-01')"
          tier_body() { echo "{\"provider\":\"other\",\"model\":\"ci-tiers\",\"inputTokens\":1000,\"outputTokens\":500,\"serviceTier\":\"$1\",\"occurredAt\":\"$YESTERDAY\"}"; }
          # Fast: 1,000 * $3 + 500 * $6 per 1M = $0.006; standard would be $0.002
          BODY=$(tier_body fast); STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.006000"' response.json
          grep -q '"serviceTier":"fast"' response.json
          BODY=$(tier_body standard); STATUS=$(post -H "authorization: Bearer $API_KEY_2"); test "$STATUS" = 201
          grep -q '"costUsd":"0.002000"' response.json
          # No flex price: refused, not billed at the standard price
          BODY=$(tier_body flex); STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 422
          grep -q '"no_tier_pricing"' response.json
          # No batch price is seeded for OpenAI, so batch usage is refused
          BODY="{\"provider\":\"openai\",\"model\":\"gpt-4.1\",\"inputTokens\":1000,\"outputTokens\":500,\"serviceTier\":\"batch\",\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 422
          grep -q '"no_batch_pricing"' response.json

          # Web search: 3 searches at Anthropic's $10 per 1,000 = $0.03, on
          # top of tokens (none here, so reconciliation's Sonnet token total
          # is unchanged). Dated today: reconciliation compares it below.
          BODY="{\"provider\":\"anthropic\",\"model\":\"claude-sonnet-5-5\",\"inputTokens\":0,\"outputTokens\":0,\"webSearchRequests\":3,\"requestId\":\"ci-search-$GITHUB_RUN_ID\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"webSearchRequests":3,"webSearchCostUsd":"0.030000"' response.json
          grep -q '"costUsd":"0.030000"' response.json
          # No web search price is seeded for OpenAI, so searches are refused
          BODY="{\"provider\":\"openai\",\"model\":\"gpt-4.1\",\"inputTokens\":1000,\"outputTokens\":500,\"webSearchRequests\":1,\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 422
          grep -q '"no_web_search_pricing"' response.json

          # Audio tokens at their own rates (gpt-realtime-2.1's), on an "other"
          # model so reconciliation is unaffected. Text: 1,000 x $4 + 500
          # cached x $0.40 + 200 out x $24; audio: 2,000 x $32 + 1,000 cached
          # x $0.40 + 800 out x $64, per 1M = $0.1246
          psql "$DATABASE_URL" -qc "INSERT INTO model_pricing (provider, model, service_tier, input_per_mtok_usd, output_per_mtok_usd, cached_input_per_mtok_usd, audio_input_per_mtok_usd, cached_audio_input_per_mtok_usd, audio_output_per_mtok_usd, effective_from) VALUES ('other', 'ci-audio', 'standard', 4, 24, 0.4, 32, 0.4, 64, '2026-01-01')"
          BODY="{\"provider\":\"other\",\"model\":\"ci-audio\",\"inputTokens\":4500,\"cachedInputTokens\":1500,\"audioInputTokens\":3000,\"cachedAudioInputTokens\":1000,\"outputTokens\":1000,\"audioOutputTokens\":800,\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"audioInputTokens":3000,"cachedAudioInputTokens":1000,"audioOutputTokens":800' response.json
          grep -q '"costUsd":"0.124600"' response.json
          # More audio output than output is invalid
          BODY='{"provider":"other","model":"ci-audio","inputTokens":10,"outputTokens":10,"audioOutputTokens":11}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); test "$STATUS" = 400
          # gpt-4.1 has no audio rates, so audio usage is refused, not billed as text
          BODY="{\"provider\":\"openai\",\"model\":\"gpt-4.1\",\"inputTokens\":1000,\"audioInputTokens\":500,\"outputTokens\":100,\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 422
          grep -q '"no_audio_pricing"' response.json

          # Image tokens at their own rates (gpt-image-2's), on an "other"
          # model: 200 text x $5 + 800 image x $8 in, 4,000 image out x $30,
          # per 1M = $0.1274
          psql "$DATABASE_URL" -qc "INSERT INTO model_pricing (provider, model, service_tier, input_per_mtok_usd, output_per_mtok_usd, cached_input_per_mtok_usd, image_input_per_mtok_usd, cached_image_input_per_mtok_usd, image_output_per_mtok_usd, effective_from) VALUES ('other', 'ci-image', 'standard', 5, 30, 1.25, 8, 2, 30, '2026-01-01')"
          BODY="{\"provider\":\"other\",\"model\":\"ci-image\",\"inputTokens\":1000,\"imageInputTokens\":800,\"outputTokens\":4000,\"imageOutputTokens\":4000,\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"imageInputTokens":800,"cachedImageInputTokens":0,"imageOutputTokens":4000' response.json
          grep -q '"costUsd":"0.127400"' response.json
          # Image and audio output together beyond the output is invalid
          BODY='{"provider":"other","model":"ci-image","inputTokens":10,"outputTokens":10,"imageOutputTokens":6,"audioOutputTokens":5}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); test "$STATUS" = 400
          # Vision input on gpt-4.1 (no image rates) is billed as text:
          # 1,000 x $2 + 100 x $8 per 1M = $0.0028
          BODY="{\"provider\":\"openai\",\"model\":\"gpt-4.1\",\"inputTokens\":1000,\"imageInputTokens\":500,\"outputTokens\":100,\"occurredAt\":\"$YESTERDAY\"}"
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"costUsd":"0.002800"' response.json

          # Attribution is stored in its own columns and returned
          BODY='{"provider":"google","model":"gemini-3.5-flash-lite","inputTokens":100,"outputTokens":10,"customerId":" cus_ci ","userId":"u_ci","feature":"ci-smoke","runId":"run_ci"}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"customerId":"cus_ci"' response.json
          test "$(psql "$DATABASE_URL" -tAc "SELECT concat_ws('|', customer_id, user_id, feature, run_id) FROM usage_events WHERE run_id = 'run_ci'")" = "cus_ci|u_ci|ci-smoke|run_ci"
          BODY='{"provider":"google","model":"gemini-3.5-flash-lite","inputTokens":1,"outputTokens":1,"feature":""}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); test "$STATUS" = 400

          # Reporting API: a read key reads the project's reports and can't
          # send usage; the ingest key can't read reports
          npm run --silent api-key -- create --project sample-app --name ci-reports --scope read > read-key.txt
          grep -q "Created read API key" read-key.txt
          READ_KEY=$(grep -oE 'act_[A-Za-z0-9_-]{43}' read-key.txt)
          echo "::add-mask::$READ_KEY"
          report() { curl -s -o report.json -w '%{http_code}' -H "authorization: Bearer $1" "http://localhost:3000/api/reports/$2"; }
          test "$(report "$READ_KEY" 'spend?groupBy=model')" = 200; cat report.json; echo
          grep -q '"key":"gpt-4.1"' report.json
          grep -q '"currency":"USD"' report.json
          test "$(report "$READ_KEY" 'spend?groupBy=week')" = 400
          test "$(report "$API_KEY_2" 'spend')" = 403
          grep -q '"insufficient_scope"' report.json
          STATUS=$(post -H "authorization: Bearer $READ_KEY"); test "$STATUS" = 403
          # Usage pages: two pages of one event each, different events
          test "$(report "$READ_KEY" 'usage?limit=1')" = 200
          FIRST=$(grep -oE '"id":"[^"]+"' report.json | head -1)
          CURSOR=$(grep -oE '"nextCursor":"[^"]+"' report.json | cut -d'"' -f4)
          test -n "$CURSOR"
          test "$(report "$READ_KEY" "usage?limit=1&cursor=$CURSOR")" = 200
          SECOND=$(grep -oE '"id":"[^"]+"' report.json | head -1)
          test -n "$SECOND" && test "$FIRST" != "$SECOND"

          # Tags: stored as sent, and filterable through the reporting API
          BODY='{"provider":"google","model":"gemini-3.5-flash-lite","inputTokens":10,"outputTokens":5,"tags":{"env":"ci","team":"search"}}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); cat response.json; echo
          test "$STATUS" = 201
          grep -q '"tags":{"env":"ci","team":"search"}' response.json
          test "$(report "$READ_KEY" 'usage?tag=env:ci')" = 200
          test "$(grep -o '"tags":{"env":"ci"' report.json | wc -l)" = 1
          BODY='{"provider":"google","model":"gemini-3.5-flash-lite","inputTokens":1,"outputTokens":1,"tags":{"customerId":"x"}}'
          STATUS=$(post -H "authorization: Bearer $API_KEY_2"); test "$STATUS" = 400

          # Outcomes: recorded once per outcomeId, attributed like usage
          outcome() { curl -s -o outcome.json -w '%{http_code}' -X POST http://localhost:3000/api/outcomes -H "authorization: Bearer $API_KEY_2" -H 'content-type: application/json' -d "$1"; }
          STATUS=$(outcome '{"name":"ticket_resolved","count":2,"outcomeId":"ci-ticket-1","customerId":"cus_ci"}'); cat outcome.json; echo
          test "$STATUS" = 201
          STATUS=$(outcome '{"name":"ticket_resolved","count":2,"outcomeId":"ci-ticket-1","customerId":"cus_ci"}'); test "$STATUS" = 200
          grep -q '"replayed":true' outcome.json
          STATUS=$(outcome '{"name":"ticket_resolved","count":3,"outcomeId":"ci-ticket-1"}'); test "$STATUS" = 409
          STATUS=$(outcome '{"name":"Ticket Resolved"}'); test "$STATUS" = 400
          test "$(psql "$DATABASE_URL" -tAc "SELECT sum(count) FROM outcomes WHERE customer_id = 'cus_ci' AND name = 'ticket_resolved'")" = 2

          # Budget check: a $0.01 run budget against run_ci's recorded spend,
          # with what's left computed independently in SQL
          psql "$DATABASE_URL" -c "UPDATE projects SET run_budget_usd = 0.01 WHERE slug = 'sample-app'"
          LEFT=$(psql "$DATABASE_URL" -tAc "SELECT (0.01 - sum(cost_usd))::numeric(14, 6) FROM usage_events WHERE run_id = 'run_ci'")
          check() { curl -s -o check.json -w '%{http_code}' -X POST http://localhost:3000/api/budget/check -H "authorization: Bearer ${2:-$API_KEY_2}" -H 'content-type: application/json' -d "$1"; }
          test "$(check "{\"runId\":\"run_ci\",\"estimatedCostUsd\":\"$LEFT\"}")" = 200; cat check.json; echo
          grep -q '"allowed":true' check.json
          grep -q "\"remainingUsd\":\"$LEFT\"" check.json
          # One micro-dollar more than what's left is denied
          MORE=$(psql "$DATABASE_URL" -tAc "SELECT ($LEFT + 0.000001)::numeric(14, 6)")
          test "$(check "{\"runId\":\"run_ci\",\"estimatedCostUsd\":\"$MORE\"}")" = 200; cat check.json; echo
          grep -q '"allowed":false,"reasons":\["run_budget"\]' check.json
          # A run with no spend yet, and the month alone, are allowed
          test "$(check '{"runId":"run_new","estimatedCostUsd":0.01}')" = 200
          grep -q '"allowed":true' check.json
          test "$(check '')" = 200
          grep -q '"run":null' check.json
          # A used-up monthly budget denies even without an estimate
          psql "$DATABASE_URL" -c "UPDATE projects SET monthly_budget_usd = 0 WHERE slug = 'sample-app'"
          test "$(check '{}')" = 200; cat check.json; echo
          grep -q '"allowed":false,"reasons":\["monthly_budget"\]' check.json
          psql "$DATABASE_URL" -c "UPDATE projects SET monthly_budget_usd = 100, run_budget_usd = NULL WHERE slug = 'sample-app'"
          # Invalid bodies, and keys of the wrong scope or none, are refused
          test "$(check '{"estimatedCostUsd":"-1"}')" = 400
          test "$(check '{}' "$READ_KEY")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/budget/check)" = 401

          # The TypeScript client: an Anthropic response with cache traffic,
          # reported through track(), priced and replayed safely.
          COST_TRACKER_API_KEY="$API_KEY_2" node scripts/smoke-client.mjs http://localhost:3000
          COST_TRACKER_API_KEY="$API_KEY_2" python3 scripts/smoke_client.py http://localhost:3000

          # OpenTelemetry: an OTLP/HTTP JSON export with an Anthropic chat span
          # (cache traffic included in input_tokens, as the GenAI conventions
          # specify), an HTTP span to ignore and a span with an unpriced model.
          otel() { curl -s -o otel.json -w '%{http_code}' -X POST http://localhost:3000/api/otel/v1/traces -H "authorization: Bearer $API_KEY_2" -H 'content-type: application/json' --data @otlp.json; }
          SPAN_ID=$(openssl rand -hex 8)
          NOW_NS=$(date +%s%N)
          cat > otlp.json <<JSON
          {"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"ci-smoke"}},{"key":"cost_tracker.feature","value":{"stringValue":"ci-otel"}},{"key":"cost_tracker.tag.env","value":{"stringValue":"otel-resource"}},{"key":"cost_tracker.tag.region","value":{"stringValue":"eu"}}]},"scopeSpans":[{"spans":[
            {"traceId":"$GITHUB_RUN_ID","spanId":"$SPAN_ID","name":"chat claude-sonnet-5-5","endTimeUnixNano":"$NOW_NS","attributes":[
              {"key":"gen_ai.operation.name","value":{"stringValue":"chat"}},
              {"key":"gen_ai.provider.name","value":{"stringValue":"anthropic"}},
              {"key":"gen_ai.request.model","value":{"stringValue":"claude-sonnet-5-5"}},
              {"key":"cost_tracker.customer_id","value":{"stringValue":"cus_otel"}},
              {"key":"user.id","value":{"stringValue":"u_otel"}},
              {"key":"cost_tracker.tag.env","value":{"stringValue":"otel"}},
              {"key":"cost_tracker.tag.version","value":{"intValue":"2"}},
              {"key":"gen_ai.usage.input_tokens","value":{"intValue":"10050"}},
              {"key":"gen_ai.usage.cache_read.input_tokens","value":{"intValue":"8000"}},
              {"key":"gen_ai.usage.cache_creation.input_tokens","value":{"intValue":"2000"}},
              {"key":"gen_ai.usage.output_tokens","value":{"intValue":"400"}}]},
            {"traceId":"$GITHUB_RUN_ID","spanId":"http-span","name":"POST","attributes":[{"key":"http.request.method","value":{"stringValue":"POST"}}]},
            {"traceId":"$GITHUB_RUN_ID","spanId":"unpriced","name":"chat","endTimeUnixNano":"$NOW_NS","attributes":[
              {"key":"gen_ai.provider.name","value":{"stringValue":"openai"}},
              {"key":"gen_ai.request.model","value":{"stringValue":"not-a-real-model"}},
              {"key":"gen_ai.usage.input_tokens","value":{"intValue":"10"}},
              {"key":"gen_ai.usage.output_tokens","value":{"intValue":"5"}}]}
          ]}]}]}
          JSON
          STATUS=$(otel); cat otel.json; echo
          test "$STATUS" = 200
          grep -q '"rejectedSpans":1' otel.json
          grep -q 'no price for openai/not-a-real-model' otel.json
          # Same Sonnet 5.5 cost as the client checks: $0.009900
          OTEL_ID="otel:$GITHUB_RUN_ID:$SPAN_ID"
          # Attribution: span attributes, plus the feature set once on the resource
          test "$(psql "$DATABASE_URL" -tAc "SELECT concat_ws('|', customer_id, user_id, feature) FROM usage_events WHERE request_id = '$OTEL_ID'")" = "cus_otel|u_otel|ci-otel"
          # Tags: the span's override the resource's key by key; ints become strings
          test "$(psql "$DATABASE_URL" -tAc "SELECT tags = '{\"env\":\"otel\",\"region\":\"eu\",\"version\":\"2\"}'::jsonb FROM usage_events WHERE request_id = '$OTEL_ID'")" = t
          # ...and from both clients, through their scoped trackers, with the
          # scoped tags merged with each call's
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE customer_id = 'cus_ts' AND feature = 'ci-ts' AND run_id LIKE 'run_ts_msg_smoke_%' AND tags = '{\"env\":\"smoke\",\"client\":\"ts\"}'::jsonb")" = 1
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE customer_id = 'cus_py' AND feature = 'ci-py' AND run_id LIKE 'run_py_msg_py_smoke_%' AND tags = '{\"env\":\"smoke\",\"client\":\"py\"}'::jsonb")" = 1
          # Each client's outcome was stored once, with its scoped attribution
          for client in ts py; do
            test "$(psql "$DATABASE_URL" -tAc "SELECT concat_ws('|', count(*), sum(count)) FROM outcomes WHERE customer_id = 'cus_$client' AND feature = 'ci-$client' AND outcome_id LIKE '$client-msg_%'")" = "1|2"
          done
          test "$(psql "$DATABASE_URL" -tAc "SELECT cost_usd FROM usage_events WHERE request_id = '$OTEL_ID'")" = 0.009900
          # A collector retrying the export, gzipped as the Collector sends
          # it by default, doesn't store the span twice
          STATUS=$(gzip -c otlp.json | curl -s -o otel.json -w '%{http_code}' -X POST http://localhost:3000/api/otel/v1/traces -H "authorization: Bearer $API_KEY_2" -H 'content-type: application/json' -H 'content-encoding: gzip' --data-binary @-)
          cat otel.json; echo; test "$STATUS" = 200
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id = '$OTEL_ID'")" = 1
          # Protobuf isn't supported; the error says how to configure JSON
          STATUS=$(curl -s -o otel.json -w '%{http_code}' -X POST http://localhost:3000/api/otel/v1/traces -H "authorization: Bearer $API_KEY_2" -H 'content-type: application/x-protobuf' --data-binary 'x')
          cat otel.json; echo; test "$STATUS" = 415

          # Reconciliation against a saved Anthropic cost report (cents as
          # decimal strings, grouped by description), never the live API.
          # Recorded today: Haiku $0.083750 (tier check above) and three
          # Sonnet events at $0.009900 (TS, Python, OTel) = $0.029700 of
          # tokens, plus $0.03 of Sonnet web search (no tokens).
          TODAY=$(date -u +%F)
          cat > cost-report.json <<JSON
          {"data":[{"starting_at":"${TODAY}T00:00:00Z","ending_at":"x","results":[
            {"amount":"8.375","currency":"USD","cost_type":"tokens","model":"claude-haiku-5-5"},
            {"amount":"2","currency":"USD","cost_type":"tokens","model":"claude-sonnet-5-5"},
            {"amount":"1","currency":"USD","cost_type":"tokens","model":"claude-sonnet-5-5"},
            {"amount":"250","currency":"USD","cost_type":"tokens","model":"claude-opus-5-5"},
            {"amount":"3","currency":"USD","cost_type":"web_search","model":null},
            {"amount":"10","currency":"USD","cost_type":"code_execution","model":null}
          ]}],"has_more":false,"next_page":null}
          JSON
          npm run --silent reconcile -- --provider anthropic --from "$TODAY" --report-file cost-report.json | tee reconcile.log
          # Haiku matches exactly; Sonnet is $0.0003 under (below a cent, not
          # flagged); Opus was billed but never recorded (flagged). Web search
          # matches in total, apart from tokens; code execution isn't tracked.
          grep -E 'claude-haiku-5-5.*\$0\.083750.*\$0\.083750.*\$0\.000000' reconcile.log
          grep -E 'claude-sonnet-5-5.*\$0\.030000.*\$0\.029700.*-\$0\.000300' reconcile.log | grep -v CHECK
          grep -E 'claude-opus-5-5.*\$2\.500000.*\$0\.000000.*-\$2\.500000.*CHECK' reconcile.log
          grep -qxF 'Web search: billed $0.030000, recorded $0.030000, diff $0.000000' reconcile.log
          grep -qF 'Billed but not tracked (code_execution): $0.100000' reconcile.log
          # Without a report file it needs an Admin API key, and says so
          if npm run --silent reconcile -- --provider anthropic --from "$TODAY" 2> reconcile-err.log; then exit 1; fi
          grep -q ANTHROPIC_ADMIN_KEY reconcile-err.log

          # OpenAI, compared per day across all models, from a saved costs
          # page (dollars as numbers, Unix-second buckets). The only OpenAI
          # usage recorded today is the $0.006 gpt-4.1 smoke event above.
          START=$(date -u -d "$TODAY" +%s)
          openai_costs() {
            echo "{\"object\":\"page\",\"data\":[{\"object\":\"bucket\",\"start_time\":$START,\"end_time\":$((START + 86400)),\"results\":[$1]}],\"has_more\":false,\"next_page\":null}" > openai-costs.json
          }
          ITEM() { echo "{\"object\":\"organization.costs.result\",\"amount\":{\"value\":$1,\"currency\":\"usd\"},\"line_item\":\"$2\",\"project_id\":null}"; }
          openai_costs "$(ITEM 0.002 'gpt-4.1, input'),$(ITEM 0.004 'gpt-4.1, output')"
          npm run --silent reconcile -- --provider openai --from "$TODAY" --report-file openai-costs.json | tee openai-reconcile.log
          grep -E 'all models.*\$0\.006000.*\$0\.006000.*\$0\.000000' openai-reconcile.log | grep -v CHECK
          grep -qF 'gpt-4.1, output' openai-reconcile.log
          # An untracked charge (images) makes the day differ, and it's flagged
          openai_costs "$(ITEM 0.002 'gpt-4.1, input'),$(ITEM 0.004 'gpt-4.1, output'),$(ITEM 0.04 'Image models')"
          npm run --silent reconcile -- --provider openai --from "$TODAY" --report-file openai-costs.json | tee openai-reconcile.log
          grep -E 'all models.*\$0\.046000.*\$0\.006000.*-\$0\.040000.*CHECK' openai-reconcile.log
          if npm run --silent reconcile -- --provider openai --from "$TODAY" 2> reconcile-err.log; then exit 1; fi
          grep -q OPENAI_ADMIN_KEY reconcile-err.log
      - name: Demo data loads, refuses production, and removes cleanly
        run: |
          npm run db:demo | tee demo.log
          grep -q "demo-support-bot: budget warning" demo.log
          grep -q "demo-research-agent: budget over" demo.log
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects WHERE slug LIKE 'demo-%'")" = 4
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) > 8000 FROM usage_events WHERE request_id LIKE 'demo-%'")" = t
          # Attribution: every demo event has a feature; checkout has no customers
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id LIKE 'demo-%' AND feature IS NULL")" = 0
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(DISTINCT customer_id) FROM usage_events WHERE request_id LIKE 'demo-support-bot-%'")" = 8
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id LIKE 'demo-checkout-assistant-%' AND customer_id IS NOT NULL")" = 0
          test "$(psql "$DATABASE_URL" -tAc "SELECT sum(count) > 100 FROM outcomes o JOIN projects p ON p.id = o.project_id WHERE p.slug = 'demo-support-bot' AND o.name = 'ticket_resolved'")" = t

          if NODE_ENV=production npm run --silent db:demo; then
            echo "demo data ran in production without --allow-production"; exit 1
          fi

          npm run db:demo -- --remove
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM usage_events WHERE request_id LIKE 'demo-%'")" = 0
      - name: Budget alerts reach a signed webhook once per threshold
        run: |
          # A local receiver that checks each request's HMAC signature.
          cat > "$RUNNER_TEMP/receiver.mjs" <<'JS'
          import { createHmac } from "node:crypto";
          import { appendFileSync, writeFileSync } from "node:fs";
          import { createServer } from "node:http";
          createServer((req, res) => {
            let body = "";
            req.on("data", (chunk) => (body += chunk));
            req.on("end", () => {
              const match = /^t=(\d+),v1=([0-9a-f]{64})$/.exec(
                req.headers["x-cost-tracker-signature"] ?? "",
              );
              const valid =
                match !== null &&
                createHmac("sha256", process.env.SECRET)
                  .update(`${match[1]}.${body}`)
                  .digest("hex") === match[2];
              const event = req.headers["x-cost-tracker-event"];
              appendFileSync("alerts.jsonl", JSON.stringify({ valid, event, body: JSON.parse(body) }) + "\n");
              res.writeHead(valid ? 200 : 401).end();
            });
          }).listen(4010, () => writeFileSync("receiver.ready", ""));
          JS
          SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$SECRET"
          SECRET="$SECRET" node "$RUNNER_TEMP/receiver.mjs" &
          RECEIVER=$!
          for _ in $(seq 50); do [ -f receiver.ready ] && break; sleep 0.2; done
          test -f receiver.ready

          # The demo data has one project at its budget warning and one over.
          npm run --silent db:demo > /dev/null
          export BUDGET_ALERT_WEBHOOK_SECRET="$SECRET"
          # Threshold alerts for the demo projects, which may also get forecast
          # or spike messages depending on the day
          demo_alerts() { jq -c 'select(.event == "budget.threshold_reached" and (.body.project.slug | startswith("demo-")))' alerts.jsonl 2>/dev/null || true; }
          # A project spiking today: $5 after an idle week, with no budget
          SPIKE_ID=$(psql "$DATABASE_URL" -qtAc "INSERT INTO projects (name, slug) VALUES ('CI Spike', 'ci-spike') RETURNING id")
          psql "$DATABASE_URL" -qc "INSERT INTO usage_events (project_id, provider, model, cost_usd, occurred_at) VALUES ('$SPIKE_ID', 'openai', 'ci-spike', 5, now())"
          spike_alerts() { jq -c 'select(.body.project.slug == "ci-spike")' alerts.jsonl 2>/dev/null || true; }

          # A dry run sends and records nothing
          BUDGET_ALERT_WEBHOOK_URL=http://localhost:4010/budget npm run --silent budget-alerts -- --dry-run | tee alerts-dry.log
          grep -E 'would_send +webhook +demo-support-bot: 80% threshold' alerts-dry.log
          grep -E 'would_send +webhook +demo-research-agent: 100% threshold' alerts-dry.log
          grep -E 'would_send +webhook +ci-spike: spike on [0-9-]+, \$5\.000000 today \(after an idle week\)' alerts-dry.log
          test -z "$(demo_alerts)"
          test -z "$(spike_alerts)"

          # An unreachable destination fails the run and records nothing
          if BUDGET_ALERT_WEBHOOK_URL=http://localhost:4011/budget npm run --silent budget-alerts > alerts-fail.log; then
            echo "a failed delivery should exit 1"; exit 1
          fi
          grep -E 'failed +webhook +demo-support-bot' alerts-fail.log
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM budget_notifications n JOIN projects p ON p.id = n.project_id WHERE p.slug LIKE 'demo-%'")" = 0
          grep -E 'failed +webhook +ci-spike: spike' alerts-fail.log
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM spend_signal_notifications WHERE project_id = '$SPIKE_ID'")" = 0

          # One signed message per project, at the highest threshold reached
          BUDGET_ALERT_WEBHOOK_URL=http://localhost:4010/budget npm run --silent budget-alerts | tee alerts.log
          demo_alerts
          test "$(demo_alerts | wc -l)" = 2
          test "$(demo_alerts | jq -s 'all(.valid and .event == "budget.threshold_reached")')" = true
          test "$(demo_alerts | jq -r 'select(.body.project.slug == "demo-support-bot") | "\(.body.thresholdPercent) \(.body.status)"')" = "80 warning"
          test "$(demo_alerts | jq -r 'select(.body.project.slug == "demo-research-agent") | "\(.body.thresholdPercent) \(.body.status)"')" = "100 over"
          # One signed spike event for the spiking project, with exact amounts
          spike_alerts
          test "$(spike_alerts | wc -l)" = 1
          test "$(spike_alerts | jq -r '"\(.valid) \(.event) \(.body.type) \(.body.todayUsd) \(.body.dailyAverageUsd) \(.body.multiple)"')" = "true spend.spike spend.spike 5.000000 0.000000 null"
          test "$(spike_alerts | jq -r .body.period)" = "$(date -u +%F)"
          # Every message the receiver got was validly signed
          test "$(jq -s 'all(.valid)' alerts.jsonl)" = true

          # Running again sends nothing new
          BUDGET_ALERT_WEBHOOK_URL=http://localhost:4010/budget npm run --silent budget-alerts | tee alerts-again.log
          grep -E 'already_sent +webhook +demo-support-bot' alerts-again.log
          grep -E 'already_sent +webhook +ci-spike: spike' alerts-again.log
          test "$(demo_alerts | wc -l)" = 2
          test "$(spike_alerts | wc -l)" = 1
          psql "$DATABASE_URL" -qc "DELETE FROM projects WHERE id = '$SPIKE_ID'"

          kill "$RECEIVER"
          npm run db:demo -- --remove
      - name: Screenshot the dashboard with demo data, in light and dark mode
        run: |
          # Demo projects only, as a new user would see them. This is the
          # job's last use of its throwaway database.
          psql "$DATABASE_URL" -c "DELETE FROM projects WHERE slug NOT LIKE 'demo-%'"
          npm run --silent db:demo
          SHOT_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$SHOT_PASSWORD"
          echo "$SHOT_PASSWORD" | npm run --silent user -- create --email demo@example.com
          SHOT_EMAIL=demo@example.com SHOT_PASSWORD="$SHOT_PASSWORD" node scripts/screenshots.mjs http://localhost:3000 screenshots
      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
      - name: Show dev server log
        if: failure()
        run: cat next-dev.log || true

  docker:
    runs-on: ubuntu-latest
    env:
      # Only for this throwaway CI stack.
      POSTGRES_PASSWORD: ci-docker-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Postgres, migrations and the app
        run: docker compose up -d --build --wait --wait-timeout 180 app
      - name: The app serves pages and enforces authentication
        run: |
          check() {
            RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$@")
            echo "$* -> $RESULT" >&2
            echo "$RESULT"
          }
          test "$(check http://localhost:3000/login | tail -1)" = "200 "
          case "$(check http://localhost:3000/projects | tail -1)" in "307 http://localhost:3000/login"*) ;; *) exit 1 ;; esac
          test "$(check -X POST http://localhost:3000/api/usage | tail -1)" = "401 "
      - name: The app runs as a non-root user
        run: |
          USER_ID=$(docker compose exec -T app id -u)
          echo "app runs as uid $USER_ID"
          test "$USER_ID" != "0"
      - name: Migrations applied and the CLI works in the tools image
        run: |
          docker compose ps -a migrate --format '{{.State}} {{.ExitCode}}' | grep -q "exited 0"
          PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$PASSWORD"
          echo "$PASSWORD" | docker compose run --rm -T migrate npm run --silent user -- create --email docker@example.com
      - name: The README quick start loads prices and demo data
        run: |
          docker compose run --rm migrate npm run --silent db:seed
          docker compose run --rm migrate npm run --silent db:demo | tee demo.log
          grep -q "demo-research-agent: budget over" demo.log
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
